<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NewLife</title>
  <meta name="description" content="NewLife: live a whole life, one choice at a time.">
  <meta name="theme-color" content="#FF8A3D">
  <link rel="icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #FFF8EC; --ink: #2B1E3F; --muted: #7A6C8F; --line: #EADFCF; --primary: #FF8A3D; --primary-dark: #D9631C; --grass: #8CCB6A; --sky-top: #2E2557; --sky-bottom: #6B4E9B; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(var(--sky-top), var(--sky-bottom)); color: #fff; font: 600 16px/1.5 "Nunito", system-ui, sans-serif; text-align: center; }
    .wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px 24px; }
    img { width: 112px; height: 112px; border-radius: 30px; box-shadow: 0 6px 0 rgba(0,0,0,0.25); margin-bottom: 18px; background: var(--primary); }
    h1 { font: 800 52px/1 "Baloo 2", system-ui, sans-serif; margin: 0; }
    p { color: #E6DDF7; margin: 10px 0 28px; font-size: 18px; }
    .btn { display: inline-block; text-decoration: none; background: var(--primary); color: #fff; font: 800 18px/1 "Baloo 2", system-ui, sans-serif; padding: 16px 24px; border-radius: 20px; box-shadow: 0 5px 0 var(--primary-dark); }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
    .ground { height: 72px; background: var(--grass); border-radius: 50% 50% 0 0 / 40px 40px 0 0; color: #2F5A1E; font-size: 14px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16px; }
    .ground a { color: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/icon.png" alt="NewLife app icon" width="112" height="112">
    <h1>NewLife</h1>
    <p>Live a whole life, one choice at a time.</p>
    <a class="btn" href="/privacy">🛡️ Privacy Policy</a>
  </div>
  <div class="ground">Questions? <a href="mailto:programmingwithanubhav@gmail.com">&nbsp;programmingwithanubhav@gmail.com</a></div>
</body>
</html>
